; php-fpm pool sized to FrankenPHP's total PHP thread count at its defaults:
; 2 worker threads per CPU plus 1 non-worker thread (9 on a 4-core box, 5 on 2 vCPUs).
; php-fpm therefore gets one more request-serving process than FrankenPHP has workers.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = 1000
pm.status_path = /fpm-status
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
