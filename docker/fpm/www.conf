; php-fpm pool sized to match the FrankenPHP image (2*cores+1 threads on a 4-core box)
; so the two runtimes are compared with the same number of PHP workers.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = 1000
pm.status_path = /fpm-status
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
